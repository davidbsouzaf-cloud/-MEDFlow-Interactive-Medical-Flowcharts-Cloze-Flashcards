
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>MedFlow</title>
<style>
:root{
  --bg:#f4f6fb;--panel:#fff;--line:#e5e9f2;--text:#20283a;
  --muted:#788399;--accent:#6478e8;--accent-soft:#eef0ff;--danger:#d95f70;
  --shadow:0 10px 30px rgba(31,42,68,.09);--radius:14px;
}
*{box-sizing:border-box}
body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);margin:0;display:flex;flex-direction:column;height:100vh;overflow:hidden}
button,input,textarea{font:inherit}
button{border:1px solid var(--line);background:#fff;color:#46516a;border-radius:9px;padding:8px 11px;font-size:12px;font-weight:650;cursor:pointer;transition:background .16s ease,border-color .16s ease,color .16s ease,box-shadow .16s ease,transform .16s ease}
button:hover{background:#f5f6ff;border-color:#cbd2f5;color:#465bd0;box-shadow:0 3px 10px rgba(70,91,208,.08)}
button:active{transform:translateY(1px)}
button:focus-visible,input:focus-visible{outline:3px solid rgba(100,120,232,.25);outline-offset:2px}
#toolbar{height:66px;min-height:66px;background:var(--panel);border-bottom:1px solid var(--line);padding:0 20px;display:flex;gap:16px;align-items:center;z-index:100;box-shadow:0 2px 12px rgba(31,42,68,.035)}
.brand{display:flex;align-items:center;gap:10px;min-width:205px}
.brand-mark{width:34px;height:34px;border-radius:11px;background:linear-gradient(145deg,#7d8cf2,#586bd8);display:grid;place-items:center;color:white;font-size:17px;font-weight:800;box-shadow:0 5px 12px rgba(91,108,218,.25)}
.brand-copy{display:flex;flex-direction:column;gap:1px}.brand-copy strong{font-size:13px;letter-spacing:.01em}.brand-copy span{font-size:10px;color:var(--muted);font-weight:600;letter-spacing:.07em;text-transform:uppercase}
.toolbar-divider{height:27px;width:1px;background:var(--line);flex:none}
.toolbar-group{display:flex;align-items:center;gap:6px}
.toolbar-spacer{flex:1}
#toolbar .save{background:var(--accent);border-color:var(--accent);color:white;padding:9px 15px;box-shadow:0 4px 10px rgba(100,120,232,.2)}
#toolbar .save:hover{background:#5268d8;border-color:#5268d8;color:white}
#toolbar .clear{color:var(--danger);background:#fff8f9;border-color:#f5dce1}
#toolbar .clear:hover{background:#fff0f2;border-color:#edbdc6}
#toolbar .import{background:#f5f7ff;color:#596bcf;border-color:#e0e5ff}
#toolbar .cloze-btn{background:#fff8e8;border-color:#f4e4b9;color:#946b18}
.cloze-control{display:flex;align-items:center;gap:8px;color:#68738a;font-size:11px;font-weight:700;white-space:nowrap}
#c{width:48px;border:1px solid var(--line);border-radius:7px;padding:6px 5px;text-align:center;color:var(--text);background:#fafbfe}
#workspace-shell{position:relative;flex:1;min-height:0;overflow:hidden;background:#f3f5fa}
#viewport{position:absolute;inset:0;overflow:auto;overscroll-behavior:contain;scrollbar-color:#cbd2e2 transparent;scrollbar-width:thin;background-color:#f4f6fb}
#canvas{width:3000px;height:3000px;position:relative;background-color:transparent;background-image:radial-gradient(#d8deea .85px,transparent .85px);background-size:22px 22px}
#svg2{z-index:40}
.connection-point.cp-blocked{display:none!important}
#zoomer{position:relative;width:3000px;height:3000px}
#canvas{position:absolute!important;left:0;top:0;transform-origin:0 0}
#viewport.panning,#viewport.panning *{cursor:grabbing!important;user-select:none}
#zoom-controls{position:static;z-index:auto;display:flex;align-items:center;gap:2px;padding:3px;background:transparent;border:0;border-radius:10px;box-shadow:none;flex:none}
#zoom-controls button{min-width:30px;height:30px;padding:0 7px;font-size:15px;border-color:transparent;background:transparent;color:#68738a}
#zoom-controls button:hover{background:var(--accent-soft);color:#5268d8}
#zoom-label{font-size:11px!important;font-weight:700;min-width:48px!important}
#format-bar{position:static;transform:none;z-index:auto;display:flex;align-items:center;gap:4px;padding:0;background:transparent;backdrop-filter:none;border:none;border-radius:0;box-shadow:none;transition:opacity .15s ease}
#format-bar select{max-width:128px}#fmt-size{width:66px}
#format-bar.idle{opacity:.45;pointer-events:none}
#format-bar select{height:30px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--text);font-size:12px;padding:0 6px;cursor:pointer}
#format-bar button{min-width:30px;height:30px;padding:0 7px;font-size:13px}
#format-bar button.on{background:var(--accent-soft);color:#5268d8;border-color:#dfe3ff}
#format-bar .fsep{width:1px;height:20px;background:var(--line);margin:0 2px}
.node-content ul,.node-content ol{text-align:left;margin:2px 0;padding-left:22px}
.node-content div,.node-content p{margin:0}
#canvas-tools{position:absolute;left:18px;top:18px;z-index:50;display:flex;flex-direction:column;gap:7px;padding:9px;background:var(--panel);border:1px solid rgba(225,230,241,.9);border-radius:15px;box-shadow:var(--shadow)}
#canvas-tools{transition:padding .18s ease,background .18s ease}
#canvas-tools #sidebar-toggle{font-size:19px;font-weight:700}
#canvas-tools.sidebar-collapsed{padding:5px}
#canvas-tools.sidebar-collapsed> :not(#sidebar-toggle){display:none!important}
#canvas-tools.sidebar-collapsed #sidebar-toggle{width:38px;height:38px}

#canvas-tools button{width:42px;height:40px;padding:0;display:grid;place-items:center;font-size:17px;border-color:transparent;background:transparent;color:#68738a}
#canvas-tools button:hover{background:var(--accent-soft);color:#5268d8}
#canvas-tools button.tool-active{background:var(--accent-soft);color:#5268d8;border-color:#dfe3ff}
#canvas-tools .tool-separator{height:1px;background:var(--line);margin:2px 4px}
.tool-tip{position:absolute;left:53px;white-space:nowrap;background:#252d40;color:white;padding:6px 9px;border-radius:7px;font-size:10px;opacity:0;pointer-events:none;transform:translateX(-4px);transition:.15s ease}
#canvas-tools button:hover .tool-tip{opacity:1;transform:translateX(0)}
.color-wrap{position:relative}
.arrow-style-wrap{position:relative;display:flex;align-items:center}
.arrow-style-wrap .color-pop{position:absolute;left:0;right:auto;top:calc(100% + 8px);bottom:auto;width:164px;min-width:164px;max-width:164px;padding:8px;transform:none;z-index:500;box-sizing:border-box}
.arrow-style-wrap .arrow-style-pop{display:none;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;align-items:center;justify-items:stretch}
.arrow-style-wrap .arrow-style-pop.open{display:grid!important}
.arrow-style-option{display:flex!important;align-items:center;justify-content:center;box-sizing:border-box;width:100%;min-width:0;height:46px!important;min-height:46px;padding:6px!important;overflow:hidden;border:1px solid var(--line)!important;border-radius:9px!important;color:var(--text)!important;background:transparent!important}
.arrow-style-option svg{position:static!important;display:block;flex:none;width:58px;height:28px;max-width:100%;overflow:hidden}
#arrow-style-toggle{display:flex!important;align-items:center;justify-content:center;gap:3px;position:relative;overflow:visible}
#arrow-style-toggle>svg{position:static!important;flex:none;width:19px;height:19px}
#arrow-style-toggle .dropdown-caret{display:block;position:static;flex:none;font-size:11px;line-height:1;margin:0}
#arrow-styles{position:relative;z-index:510;flex:none}
#arrow-styles .arrow-style-wrap{z-index:510}
#pop-arrow-style{isolation:isolate}
.arrow-style-option svg path{fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.arrow-style-option:hover,.arrow-style-option.tool-active{background:var(--accent-soft)!important;border-color:#cbd2f5!important;color:#5268d8!important}
.arrow-style-option:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.dropdown-caret{font-size:12px;margin-left:2px}
#pop-color{min-width:190px}
/* Image nodes: same node/cloze/connection behavior, image is the node content. */
.node.type-image{padding:3px;min-width:40px;min-height:40px;background:#fff;overflow:visible;display:flex;flex-direction:column;align-items:stretch;justify-content:flex-start}
.node.type-image .node-content{width:100%;flex:1 1 0;min-height:0;display:flex;align-items:center;justify-content:center;pointer-events:none;overflow:hidden}
.node.type-image .node-content img{display:block;width:100%;height:100%;object-fit:contain;pointer-events:none;user-select:none}
.node-resize{position:absolute;right:-8px;bottom:-8px;width:17px;height:17px;border:2px solid #fff;border-radius:4px;background:#6478e8;box-shadow:0 0 0 1px #6478e8;cursor:nwse-resize;z-index:35;padding:0!important;opacity:0}
.node.selected .node-resize,.node:hover .node-resize{opacity:1}
/* Nodes */
.node{position:absolute;width:190px;min-height:54px;padding:13px 15px;background:#fff;border:1.5px solid #dce2ed;border-radius:13px;cursor:grab;box-shadow:0 5px 14px rgba(37,49,77,.08);color:#273149;z-index:10;display:flex;align-items:center;justify-content:center;user-select:none;transition:border-color .16s ease,box-shadow .16s ease,background .16s ease}
.node:hover{border-color:#b9c4ed;box-shadow:0 8px 19px rgba(37,49,77,.12)}
.node:active{cursor:grabbing}
.node.type-decision{--df:#fff8eb;--db:#e6cd8a;background:transparent!important;border:none!important;box-shadow:none!important;border-radius:0;text-align:center;padding:13px 36px;filter:drop-shadow(0 5px 7px rgba(37,49,77,.15))}
.node.type-decision::before,.node.type-decision::after{content:'';position:absolute;z-index:-1;pointer-events:none}
.node.type-decision::before{inset:0;background:var(--db);clip-path:polygon(24px 0,calc(100% - 24px) 0,100% 50%,calc(100% - 24px) 100%,24px 100%,0 50%)}
.node.type-decision::after{inset:2px;background:var(--df);clip-path:polygon(22px 0,calc(100% - 22px) 0,100% 50%,calc(100% - 22px) 100%,22px 100%,0 50%)}
/* Custom colour (node.color): --nc = border / accent, --nfl / --nfd = light / dark tinted fill. Kept above the hover / selected rules so those still win. */
.node.has-color:not(.type-decision){background:var(--nfl);border-color:var(--nc)}
html[data-theme="dark"] .node.has-color:not(.type-decision){background:var(--nfd)}
.node.type-decision.has-color{--df:var(--nfl);--db:var(--nc)}
html[data-theme="dark"] .node.type-decision.has-color{--df:var(--nfd);--db:var(--nc)}
.node.type-decision:hover{--db:#d4b868}
.node.type-decision.selected{--db:var(--accent);filter:drop-shadow(0 0 6px rgba(100,120,232,.5))}
.node.type-decision.linking-source{--db:#8b5cf6;filter:drop-shadow(0 0 7px rgba(139,92,246,.55))}
.node.type-decision.editing{--db:#5b9b83}
.type-info{background:#f0f6ff;border-color:#cbdcf7;border-radius:4px}
.selected{border:2px solid var(--accent)!important;box-shadow:0 0 0 4px rgba(100,120,232,.13),0 9px 20px rgba(37,49,77,.1)!important}
.linking-source{border:2px solid #8b5cf6!important;background:#f5f0ff!important;box-shadow:0 0 0 5px rgba(139,92,246,.2)!important}
.node-content{width:100%;text-align:center;outline:none;pointer-events:none;line-height:1.45;font-size:13px;font-weight:550;overflow-wrap:anywhere}
.node.editing .node-content{pointer-events:auto;cursor:text;user-select:text;background:rgba(255,255,255,.65);border-radius:5px}
.node.editing{cursor:text!important;border-color:#5b9b83!important;box-shadow:0 0 0 4px rgba(91,155,131,.14)!important}
.node-extra-badge{position:absolute;bottom:-9px;left:-9px;background:#e6f4ec;color:#2f7a52;padding:3px 7px;border:1px solid #b9dcc8;font-size:10px;border-radius:20px;font-weight:800;box-shadow:0 2px 5px rgba(30,70,50,.08)}
#extraBox p,#hintBox p{font-size:12px;color:#6f7a90;line-height:1.5;margin:0}
#extraText,#hintText{height:150px;text-align:left}
#extraImgs{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:0 0 10px}
#extraImgs:empty{display:none}
.xi{position:relative}.xi img{height:68px;max-width:130px;object-fit:cover;border-radius:8px;border:1px solid var(--line);display:block}
.xi b{position:absolute;top:-7px;right:-7px;width:20px;height:20px;line-height:18px;text-align:center;background:#fff;border:1px solid var(--line);border-radius:50%;font-size:13px;cursor:pointer;color:#a33}
.node-cloze{position:absolute;top:-9px;right:-9px;background:#fff1c9;color:#946b18;padding:3px 7px;border:1px solid #f0d995;font-size:10px;border-radius:20px;font-weight:800;box-shadow:0 2px 5px rgba(80,65,20,.08)}
.node{touch-action:none;transition:border-color .16s ease,box-shadow .16s ease,background .16s ease}.node.is-dragging{transition:none!important;z-index:30;box-shadow:0 14px 30px rgba(37,49,77,.18)}.node-content{white-space:pre-wrap}.connection-point{position:absolute!important;width:12px!important;height:12px!important;min-width:12px;padding:0!important;border:2px solid #fff!important;border-radius:50%!important;background:#7183e8!important;box-shadow:0 0 0 1.5px #7183e8,0 2px 6px rgba(40,55,100,.18)!important;opacity:0;transform:scale(.72);transition:opacity .14s ease,transform .14s ease;z-index:25;cursor:crosshair!important}.node:hover .connection-point,.node.selected .connection-point{opacity:1;transform:scale(1)}.connection-point:hover{background:#405bd8!important;box-shadow:0 0 0 4px rgba(100,120,232,.16)!important;transform:scale(1.25)!important}.point-top{left:50%;top:-7px;transform:translateX(-50%) scale(.72)}.point-top:hover,.node:hover .point-top,.node.selected .point-top{transform:translateX(-50%) scale(1)}.point-bottom{left:50%;bottom:-7px;transform:translateX(-50%) scale(.72)}.point-bottom:hover,.node:hover .point-bottom,.node.selected .point-bottom{transform:translateX(-50%) scale(1)}.point-left{left:-7px;top:50%;transform:translateY(-50%) scale(.72)}.point-left:hover,.node:hover .point-left,.node.selected .point-left{transform:translateY(-50%) scale(1)}.point-right{right:-7px;top:50%;transform:translateY(-50%) scale(.72)}.point-right:hover,.node:hover .point-right,.node.selected .point-right{transform:translateY(-50%) scale(1)}svg{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:5;overflow:visible}
svg line{stroke:#aab4c8;stroke-width:2;stroke-linecap:round;opacity:.9}
.guide-line{position:absolute;background:#8290eb;z-index:100;pointer-events:none;display:none;opacity:.75}
#saveModal,#importModal,#extraModal,#hintModal,#labelModal{display:none;position:fixed;inset:0;width:100%;height:100%;background:rgba(25,33,51,.35);backdrop-filter:blur(5px);align-items:center;justify-content:center;z-index:200;padding:20px}
#saveBox,#importBox,#extraBox,#hintBox,#labelBox{background:#fff;padding:25px;border:1px solid var(--line);border-radius:17px;width:min(420px,100%);text-align:center;box-shadow:0 20px 60px rgba(22,32,57,.2)}
#saveBox h3,#importBox h3,#extraBox h3,#hintBox h3,#labelBox h3{margin:0 0 12px;font-size:18px;color:var(--text)}
#saveBox p{font-size:13px;color:#6f7a90;line-height:1.6}
#saveBox button,#importBox button,#extraBox button,#hintBox button,#labelBox button{margin-top:8px}
#labelBox p{font-size:12px;color:#6f7a90;line-height:1.5;margin:0 0 10px}
#labelInput{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:#fafbfe;color:var(--text);font-size:14px;margin-bottom:6px}
.elabel{cursor:pointer;pointer-events:all}
.elabel rect{fill:#fff;stroke:#dce2ed;stroke-width:1.5}
.elabel text{fill:#5b6785;font:600 12px Inter,ui-sans-serif,system-ui,"Segoe UI",sans-serif;text-anchor:middle;dominant-baseline:central;user-select:none}
.elabel.sel rect{stroke:#6478e8}
textarea{width:100%;height:110px;margin:12px 0;border:1px solid var(--line);border-radius:10px;padding:10px;resize:vertical;color:var(--text);background:#fafbfe}
@media(max-width:760px){#toolbar{padding:0 10px;gap:8px;height:auto;min-height:60px;flex-wrap:wrap;padding-top:8px;padding-bottom:8px}.brand{min-width:auto}.brand-copy span{display:none}.toolbar-divider{display:none}#toolbar .toolbar-group{gap:4px}#toolbar button{padding:7px 8px;font-size:11px}.toolbar-spacer{display:none}#canvas-tools{left:10px;top:10px}}

/* Dark theme (set from Anki's night mode) */
html[data-theme="dark"]:root{--bg:#161a24;--panel:#1e2432;--line:#2c3447;--text:#e4e8f2;--muted:#8e9ab3;--accent:#7b8cf0;--accent-soft:#2a3150;--danger:#f08a98;--shadow:0 10px 30px rgba(0,0,0,.4);color-scheme:dark}
html[data-theme="dark"] button{background:#232a3b;color:#c7cee0}
html[data-theme="dark"] button:hover{background:#2b3350;border-color:#47528a;color:#dfe4ff;box-shadow:none}
html[data-theme="dark"] #toolbar{box-shadow:0 2px 12px rgba(0,0,0,.3)}
html[data-theme="dark"] #toolbar .save:hover{background:#6b7de6;border-color:#6b7de6;color:#fff}
html[data-theme="dark"] #toolbar .clear{background:#3a2229;border-color:#5a2f39;color:#f08a98}
html[data-theme="dark"] #toolbar .clear:hover{background:#4a2830;border-color:#7a3a47}
html[data-theme="dark"] #toolbar .import{background:#262d4a;color:#a9b6ff;border-color:#37406b}
html[data-theme="dark"] #toolbar .cloze-btn{background:#3b3220;border-color:#5c4c25;color:#e6c26a}
html[data-theme="dark"] .cloze-control{color:#a4aec6}
html[data-theme="dark"] #c{background:#1d2231;color:var(--text)}
html[data-theme="dark"] #workspace-shell{background:#161a24}
html[data-theme="dark"] #viewport{background-color:#161a24;scrollbar-color:#3a4358 transparent}
html[data-theme="dark"] #canvas{background-image:radial-gradient(#2a3144 .85px,transparent .85px)}
html[data-theme="dark"] #zoom-controls,html[data-theme="dark"] #canvas-tools{border-color:#2c3447}
html[data-theme="dark"] #zoom-controls button,html[data-theme="dark"] #canvas-tools button{color:#a4aec6;background:transparent}
html[data-theme="dark"] #zoom-controls button:hover,html[data-theme="dark"] #canvas-tools button:hover,html[data-theme="dark"] #canvas-tools button.tool-active{background:var(--accent-soft);color:#b8c3ff}
html[data-theme="dark"] .tool-tip{background:#e4e8f2;color:#161a24}
html[data-theme="dark"] .node{background:#222a3c;border-color:#36405a;color:#e4e8f2;box-shadow:0 5px 14px rgba(0,0,0,.35)}
html[data-theme="dark"] .node:hover{border-color:#5865a6;box-shadow:0 8px 19px rgba(0,0,0,.45)}
html[data-theme="dark"] .node.type-decision{--df:#3a3220;--db:#6b5a2a}
html[data-theme="dark"] .node.type-decision:hover{--db:#8a7436}
html[data-theme="dark"] .node.type-decision.selected{--db:var(--accent)}
html[data-theme="dark"] .node.type-decision.linking-source{--db:#a78bfa}
html[data-theme="dark"] .linking-source{background:#2b2447!important;border-color:#a78bfa!important}
html[data-theme="dark"] .node.type-decision.editing{--db:#5b9b83}
html[data-theme="dark"] .type-info{background:#1f2c45;border-color:#35507c}
html[data-theme="dark"] .node.editing .node-content{background:rgba(255,255,255,.08)}
html[data-theme="dark"] .node-extra-badge{background:#1f3a2d;color:#7fd1a2;border-color:#2f6048}
html[data-theme="dark"] .node-cloze{background:#4a3c18;color:#f0c864;border-color:#7a6226}
html[data-theme="dark"] .connection-point{border-color:#222a3c!important}
html[data-theme="dark"] svg line{stroke:#6c7896}
html[data-theme="dark"] #saveBox,html[data-theme="dark"] #importBox,html[data-theme="dark"] #extraBox,html[data-theme="dark"] #hintBox,html[data-theme="dark"] #labelBox{background:#1e2433}
html[data-theme="dark"] #labelInput{background:#1a1f2d;color:var(--text)}
html[data-theme="dark"] .elabel rect{fill:#222a3c;stroke:#36405a}
html[data-theme="dark"] .elabel text{fill:#c7cee0}
html[data-theme="dark"] .elabel.sel rect{stroke:#7b8cf0}
html[data-theme="dark"] #saveBox p,html[data-theme="dark"] #extraBox p,html[data-theme="dark"] #hintBox p{color:#9aa5bd}
html[data-theme="dark"] textarea{background:#1a1f2d;color:var(--text)}
html[data-theme="dark"] .xi b{background:#232a3b}
html[data-theme="dark"] #format-bar{border-color:#2c3447}
html[data-theme="dark"] #format-bar select{background:#232a3b;color:#c7cee0;border-color:#2c3447}
html[data-theme="dark"] #format-bar button.on{background:#2a3150;color:#b8c3ff;border-color:#47528a}
.node.selected:not(.type-decision){border-color:#6478e8;box-shadow:0 0 0 3px rgba(100,120,232,.22),0 8px 20px rgba(37,49,77,.12)}
html[data-theme="dark"] .node.selected:not(.type-decision){border-color:#7b8cf0;box-shadow:0 0 0 3px rgba(123,140,240,.28),0 8px 20px rgba(0,0,0,.35)}
#toolbar .tb-icon{width:36px;height:34px;padding:0;display:grid;place-items:center;font-size:18px;background:transparent;border-color:transparent;color:#68738a}
#toolbar .tb-icon:hover{background:var(--accent-soft);color:#5268d8}
#toolbar .tb-icon.tool-active{background:var(--accent-soft);color:#5268d8;border-color:#dfe3ff}
#toolbar .tb-icon svg{width:20px;height:20px;display:block;position:static!important;pointer-events:none}
html[data-theme="dark"] #toolbar .tb-icon{color:#a4aec6;background:transparent}
html[data-theme="dark"] #toolbar .tb-icon:hover,html[data-theme="dark"] #toolbar .tb-icon.tool-active{background:var(--accent-soft);color:#b8c3ff}
#canvas-tools button svg{display:block;position:static!important;width:18px!important;height:18px!important;min-width:0;pointer-events:none}
/* Colour pickers (toolbar) */
.color-wrap{position:relative}
#toolbar .color-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
#toolbar .color-btn svg{width:18px;height:16px}
.color-btn .swatch{display:block;width:18px;height:5px;border-radius:2px;border:1px solid rgba(0,0,0,.22)}
.color-pop{display:none;position:absolute;top:calc(100% + 10px);left:50%;transform:translateX(-50%);z-index:300;width:200px;padding:12px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.color-pop.open{display:block}
.color-pop-title{font-size:10px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:0 0 9px}
.color-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;justify-items:center}
.color-pop .color-sw{width:26px;height:26px;min-width:0;padding:0;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line)}
.color-pop .color-sw:hover{transform:scale(1.12);box-shadow:0 0 0 1px #b9c4ed}
.color-pop .color-sw.on{box-shadow:0 0 0 2px var(--accent)}
.color-row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:12px}
.color-row label{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;color:var(--muted)}
.color-row input[type=color]{width:32px;height:24px;padding:0;border:1px solid var(--line);border-radius:6px;background:none;cursor:pointer}
.color-row button{padding:5px 9px}
html[data-theme="dark"] .color-pop{background:#1e2433;border-color:#2c3447}
html[data-theme="dark"] .color-pop .color-sw{border-color:#1e2433;box-shadow:0 0 0 1px #36405a}
html[data-theme="dark"] .color-pop .color-sw.on{box-shadow:0 0 0 2px var(--accent)}
html[data-theme="dark"] .color-btn .swatch{border-color:rgba(255,255,255,.28)}
/* Templates panel */
#toolbar .tpl-btn{width:auto;padding:0 10px;display:flex;flex-direction:row;align-items:center;gap:6px;font-size:12px;font-weight:650}
#toolbar .tpl-btn svg{width:18px;height:18px}
.tpl-pop{width:350px;left:0;transform:none;max-height:calc(100vh - 110px);overflow:auto}
.tpl-list{display:flex;flex-direction:column;gap:6px}
.tpl-item{display:flex;align-items:center;gap:8px;padding:9px 10px;border:1px solid var(--line);border-radius:10px;cursor:pointer;text-align:left}
.tpl-item:hover{background:var(--accent-soft);border-color:#cbd2f5}
.tpl-main{flex:1;min-width:0}
.tpl-name{font-size:12.5px;font-weight:750;color:var(--text)}
.tpl-desc{font-size:10.5px;color:var(--muted);line-height:1.4;margin-top:2px}
.tpl-del{width:24px;height:24px;min-width:24px;padding:0;border-color:transparent;background:transparent;color:#a4aec6;font-size:16px;line-height:1}
.tpl-del:hover{background:#fff0f2;border-color:#f5dce1;color:var(--danger)}
.tpl-empty{font-size:11.5px;color:var(--muted);line-height:1.5;padding:6px 2px}
.tpl-save{margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.tpl-save input[type=text]{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:#fafbfe;color:var(--text);font-size:12px;margin-bottom:6px}
.tpl-actions{display:flex;gap:6px;justify-content:space-between;align-items:center;margin-top:4px}
.tpl-hint{font-size:10.5px;color:var(--muted);line-height:1.45;margin:2px 0 0}
html[data-theme="dark"] .tpl-item:hover{border-color:#47528a}
html[data-theme="dark"] .tpl-del{background:transparent;color:#8e9ab3}
html[data-theme="dark"] .tpl-del:hover{background:#3a2229;border-color:#5a2f39;color:#f08a98}
html[data-theme="dark"] .tpl-save input[type=text]{background:#1a1f2d}

/* Image caption, hint button and focus flow */
.node-hint{position:absolute;top:-10px;left:-10px;width:22px!important;height:22px!important;min-width:0!important;padding:0!important;box-sizing:border-box;border:1.5px dashed #b8c1d8;border-radius:50%;background:#fff;color:#8793ad;font:800 15px/1 Arial,sans-serif;display:grid;place-items:center;cursor:pointer;z-index:34;opacity:0;transition:opacity .15s}
.node:hover .node-hint,.node.selected .node-hint{opacity:1}
.node-hint.has-hint{opacity:1;border:1.5px solid #d6a83e;background:#fff3ce;color:#946b18}
.node-focus-badge{position:absolute;top:-9px;left:18px;background:#ece8ff;color:#5b44c9;padding:3px 7px;border:1px solid #cbc2fa;font-size:10px;border-radius:20px;font-weight:800;box-shadow:0 2px 5px rgba(60,40,130,.1);pointer-events:none}
.node.is-focus:not(.type-decision){outline:2px dashed #7c5cff;outline-offset:3px}
html[data-theme="dark"] .node-hint{background:#222a3c;border-color:#4a5675;color:#9aa5bd}
html[data-theme="dark"] .node-hint.has-hint{background:#4a3c18;color:#f0c864;border-color:#7a6226}
html[data-theme="dark"] .node-focus-badge{background:#2d2650;color:#bcaeff;border-color:#4b3fa0}
.marquee{position:absolute;z-index:90;border:1.5px dashed #6478e8;background:rgba(100,120,232,.12);border-radius:3px;pointer-events:none}
.node-hint.has-hint{display:none}
.node-hint-label{position:absolute;left:-8px;bottom:calc(100% + 10px);width:max-content;max-width:240px;box-sizing:border-box;padding:3px 9px;background:#e1f5e9;color:#17623c;border:1.5px solid #5fbf8a;border-radius:8px;font:700 12px/1.35 Arial,sans-serif;white-space:pre-wrap;overflow-wrap:anywhere;cursor:pointer;z-index:34;box-shadow:0 3px 8px rgba(30,100,60,.15)}
#hintPop{position:fixed;z-index:300;width:230px;box-sizing:border-box;padding:8px;background:#fff;border:1px solid #cfe5d8;border-radius:12px;box-shadow:0 10px 30px rgba(22,32,57,.22);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
#hintPop textarea{display:block;width:100%;height:62px;box-sizing:border-box;resize:none;padding:6px 8px;border:1.5px solid #9fd3b5;border-radius:8px;outline:none;background:#fff;color:#273149;font:13px/1.4 Arial,sans-serif}
#hintPop textarea:focus{border-color:#2f7a52}
#hintPop button{padding:4px 14px;margin:0}
#hintPop .hp-ok{background:#2f9e68;border-color:#2f9e68;color:#fff;font-weight:700}
html[data-theme="dark"] .node-hint-label{background:#1f3a2d;color:#7fd1a2;border-color:#2f6048}
html[data-theme="dark"] #hintPop{background:#1e2433;border-color:#36405a}
html[data-theme="dark"] #hintPop textarea{background:#161a24;color:#e4e8f2;border-color:#2f6048}
.node-caption{flex:none;width:100%;box-sizing:border-box;padding:4px 6px;border-top:1px solid #dfe5f0;background:transparent;color:#273149;font:600 12px/1.35 Arial,sans-serif;text-align:center;white-space:pre-wrap;overflow-wrap:anywhere;overflow:hidden;outline:none;cursor:text;user-select:text;pointer-events:auto}
.node-caption:empty::before{content:attr(data-ph);color:#aab3c6;font-weight:500}
.node-caption:focus{background:rgba(100,120,232,.08);border-top-color:#6478e8}
html[data-theme="dark"] .node-caption{color:#e4e8f2;border-top-color:#36405a}
html[data-theme="dark"] .node-caption:empty::before{color:#6f7b96}
@media(max-width:1360px){#toolbar{flex-wrap:wrap;height:auto;padding-top:8px;padding-bottom:8px}}
html.multisel .node.selected:not(.type-decision){border-color:#a78bfa!important;background-image:linear-gradient(rgba(167,139,250,.12),rgba(167,139,250,.12));box-shadow:0 0 0 3px rgba(167,139,250,.32),0 8px 20px rgba(37,49,77,.12)!important}
html.multisel .node.type-decision.selected{--db:#a78bfa;filter:drop-shadow(0 0 7px rgba(167,139,250,.7))}
html[data-theme="dark"].multisel .node.selected:not(.type-decision){border-color:#b79cff!important;box-shadow:0 0 0 3px rgba(183,156,255,.34),0 8px 20px rgba(0,0,0,.35)!important}
html[data-theme="dark"].multisel .node.type-decision.selected{--db:#b79cff}
html.multisel .node.selected .node-resize{background:#a78bfa}
html.multisel .node.selected .connection-point{background:#a78bfa!important}
html.multisel .elabel.sel rect{stroke:#a78bfa}
.marquee{border:2px solid #a78bfa;background:rgba(167,139,250,.18);box-shadow:0 0 0 1px rgba(255,255,255,.3) inset;border-radius:4px}
.marquee[data-n]::after{content:attr(data-n);position:absolute;right:-2px;top:-26px;padding:2px 8px;border-radius:10px;background:#a78bfa;color:#fff;font:700 11px Arial,sans-serif}
#viewport,#viewport *{-webkit-user-drag:none;user-drag:none}
#viewport,#svg,#svg *{user-select:none;-webkit-user-select:none}
#viewport .node-caption,#viewport .node.editing,#viewport .node.editing *{user-select:text;-webkit-user-select:text}
</style>
</head>
<body>
<header id="toolbar">
  <div class="brand"><div class="brand-mark">M</div><div class="brand-copy"><strong>MedFlow</strong><span>Flowchart editor</span></div></div>
  <div class="toolbar-divider"></div>
  <div class="toolbar-group" id="fmt-group">
  <div id="format-bar" class="idle" onmousedown="if(!/^(SELECT|OPTION)$/.test(event.target.tagName))event.preventDefault()">
    <select id="fmt-size" title="Font size" onchange="fmtSize(this.value)"></select>
    <select id="fmt-font" title="Font" onchange="fmtFont(this.value)"></select>
    <div class="fsep"></div>
    <button id="fmt-b" onclick="fmt('bold')" title="Bold (Ctrl+B)"><b>B</b></button>
    <button id="fmt-i" onclick="fmt('italic')" title="Italic (Ctrl+I)"><i>I</i></button>
    <button id="fmt-u" onclick="fmt('underline')" title="Underline (Ctrl+U)"><u>U</u></button>
    <div class="fsep"></div>
    <button id="fmt-ul" onclick="fmt('insertUnorderedList')" title="Bullet list">•≡</button>
    <button id="fmt-ol" onclick="fmt('insertOrderedList')" title="Numbered list">1.≡</button>
    <div class="fsep"></div>
    <button onclick="fmtClear()" title="Clear formatting">Tx</button>
  </div>
  </div>
  <div class="toolbar-divider"></div>
  <div id="cloze-slot" style="display:contents">
  <div class="toolbar-group">
    <label class="cloze-control" for="c">CLOZE # <input id="c" type="number" value="0"></label>
    <button class="cloze-btn" onclick="applyCloze(0)" title="Apply current number (Ctrl+Shift+Alt+C)">Apply</button>
    <button class="cloze-btn" onclick="applyCloze(1)" title="Increment and apply (Ctrl+Shift+C)">+1</button>
  </div>
  <div class="toolbar-divider"></div>
  </div>
  <div class="toolbar-group" id="arrow-styles">
    <div class="color-wrap arrow-style-wrap">
      <button class="tb-icon" id="arrow-style-toggle" onclick="toggleArrowStylePop(event)" title="Arrow style" aria-label="Arrow style" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20C4 9 20 15 20 5"/><path d="M15.5 8L20 4.5 22 9.5"/></svg><span class="dropdown-caret">⌄</span></button>
      <div class="color-pop arrow-style-pop" id="pop-arrow-style" onclick="event.stopPropagation()">
        <button type="button" class="arrow-style-option" id="as-curve" onclick="chooseArrowStyle('curve')" aria-label="Curved arrow"><svg viewBox="0 0 64 32" aria-hidden="true"><path d="M6 25 C20 25 32 12 56 12 M48 6 L56 12 L48 18"/></svg></button>
        <button type="button" class="arrow-style-option" id="as-straight" onclick="chooseArrowStyle('straight')" aria-label="Straight arrow"><svg viewBox="0 0 64 32" aria-hidden="true"><path d="M6 16 H57 M49 8 L57 16 L49 24"/></svg></button>
        <button type="button" class="arrow-style-option" id="as-elbow" onclick="chooseArrowStyle('elbow')" aria-label="Elbow arrow"><svg viewBox="0 0 64 32" aria-hidden="true"><path d="M6 26 H30 V12 H56 M49 6 L56 12 L49 18"/></svg></button>
        <button type="button" class="arrow-style-option" id="as-dash" onclick="chooseArrowStyle('dash')" aria-label="Dashed arrow"><svg viewBox="0 0 64 32" aria-hidden="true"><path d="M6 16 H57 M49 8 L57 16 L49 24" stroke-dasharray="4 3"/></svg></button>
      </div>
    </div>
  </div>
  <div class="toolbar-divider"></div>
  <div class="toolbar-group" id="color-tools">
    <div class="color-wrap">
      <button class="tb-icon color-btn" id="cb-color" onclick="toggleColorPop(event)" title="Color selected boxes or arrows, or set the default color" aria-label="Color"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a9 9 0 1 0 0 18h1.2a2 2 0 0 0 1.5-3.3 1.7 1.7 0 0 1 1.3-2.8H18a3 3 0 0 0 3-3c0-5-4-9-9-9Z"/><circle cx="7.5" cy="10" r="1"/><circle cx="11" cy="6.8" r="1"/><circle cx="16" cy="8" r="1"/></svg><i class="swatch" id="sw-color"></i></button>
      <div class="color-pop" id="pop-color" onclick="event.stopPropagation()"></div>
    </div>
    <div class="toolbar-divider"></div>
    <div class="color-wrap">
      <button class="tb-icon tpl-btn" id="cb-tpl" onclick="toggleTplPop(event)" title="Templates: ready-made flowcharts (main topic + branches)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="6" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/><rect x="15" y="13" width="6" height="8" rx="2"/></svg><span>Templates</span></button>
      <div class="color-pop tpl-pop" id="pop-tpl" onclick="event.stopPropagation()"></div>
    </div>
    <div class="toolbar-divider"></div>
    <div id="zoom-controls" aria-label="Canvas zoom"><button onclick="zoomBy(1/1.2)" title="Zoom out (Ctrl+-)">−</button><button id="zoom-label" onclick="setZoom(1)" title="Reset zoom (Ctrl+0)">100%</button><button onclick="zoomBy(1.2)" title="Zoom in (Ctrl+=)">+</button><button onclick="fitView()" title="Fit everything (Ctrl+9)">⤢</button></div>
  </div>
  <div class="toolbar-spacer"></div>
  <div class="toolbar-group">
    <button class="import" onclick="showImport()" title="Import JSON code">⇧ Import</button>
    <button class="clear" onclick="clearAll()" title="Clear all (Ctrl+Shift+Del)">Clear all</button>
    <button class="save" onclick="exportData()" title="Copy data to clipboard">↗ Save / Copy</button>
  </div>
</header>
<div id="workspace-shell">
  <div id="viewport"><div id="zoomer"><div id="canvas"><svg id="svg"></svg><div id="nodes"></div><svg id="svg2"></svg>
    <div id="guide-x" class="guide-line" style="height:100%;width:1px;top:0"></div>
    <div id="guide-y" class="guide-line" style="width:100%;height:1px;left:0"></div>
  </div></div></div>
  <nav id="canvas-tools" class="sidebar-collapsed" aria-label="Editor tools">
    <button id="sidebar-toggle" onclick="toggleSidebar()" title="Expand sidebar" aria-label="Expand sidebar">›<span class="tool-tip">Expand sidebar</span></button>
    <button onclick="add('box')" title="Add step (with boxes selected in lilac: turns them into steps)">▢<span class="tool-tip">Add step</span></button>
    <button onclick="add('decision')" title="Add decision (with boxes selected in lilac: turns them into decisions)">◇<span class="tool-tip">Add decision</span></button>
    <button onclick="add('info')" title="Add information (with boxes selected in lilac: turns them into information)">ⓘ<span class="tool-tip">Add information</span></button>
    <button onclick="addImageNode()" title="Add image node">▧<span class="tool-tip">Add image node</span></button>
    <div class="tool-separator"></div>
    <button id="btn-link" onclick="toggleLink()" title="Link mode (Ctrl+L): pick a parent box, then click its children">↗<span class="tool-tip">Link: parent → children</span></button>
    <button onclick="editExtra()" title="Box extra (Ctrl+Shift+X)">≡<span class="tool-tip">Box extra</span></button>
    <button id="btn-focus" onclick="toggleFocus()" title="Focus branch (Ctrl+Shift+F): select the boxes of the branch (Shift+drag), or just its first box to take everything that hangs from it. In review the arrows are created from the box it hangs from as the clozes are answered, and the rest of the chart is omitted">◉<span class="tool-tip">Focus branch</span></button>
    <button onclick="labelSelected()" title="Arrow label (double-click an arrow)">ab<span class="tool-tip">Arrow label</span></button>
    <button id="btn-bif" onclick="toggleBifurcation()" title="Bifurcate (Ctrl+G): Shift+click 2 or more arrows leaving the same box, then click here. Click again to split them back"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 21v-8M12 13C12 8 5 9 5 3M12 13c0-5 7-4 7-10"/></svg><span class="tool-tip">Bifurcate arrows</span></button>

  </nav>

</div>
<div id="saveModal"><div id="saveBox"><h3>Data copied</h3><p>1. Return to Anki.<br>2. Paste into <b>Algorithm_JSON</b>.<br>3. Click <b>Sync</b> to update your cards.</p><button onclick="document.getElementById('saveModal').style.display='none'">Close</button></div></div>
<div id="labelModal"><div id="labelBox"><h3>Arrow label</h3><p>Text shown on the arrow. Leave empty to remove it.</p><input id="labelInput" maxlength="80" placeholder="e.g. Yes, No, > 5 cm..." onkeydown="if(event.key==='Enter'){saveLabel()}else if(event.key==='Escape'){closeLabel()}"><br><button onclick="saveLabel()" class="import">Save</button> <button onclick="closeLabel()">Cancel</button></div></div>
<div id="extraModal"><div id="extraBox"><h3>Box extra</h3><p id="extraHint"></p><textarea id="extraText" placeholder="Extra shown on the back of the card when this box's cloze is asked... (Ctrl+V pastes an image)" onkeydown="if(event.key==='Escape'){closeExtra()}else if((event.ctrlKey||event.metaKey)&&event.key==='Enter'){saveExtra()}"></textarea><div id="extraImgBox" style="display:none"><div id="extraImgs"></div><button onclick="addExtraImage()">+ Add image</button><br></div><br><button onclick="saveExtra()" class="import">Save</button> <button onclick="closeExtra()">Cancel</button></div></div>
<div id="importModal"><div id="importBox"><h3>Import flowchart</h3><textarea id="importText" placeholder="Paste JSON data here..."></textarea><br><button onclick="doImport()" class="import">Import</button> <button onclick="document.getElementById('importModal').style.display='none'">Cancel</button></div></div>
<script>
let data={};
function setSidebarCollapsed(collapsed){
  const nav=document.getElementById('canvas-tools');
  const btn=document.getElementById('sidebar-toggle');
  nav.classList.toggle('sidebar-collapsed',collapsed);
  btn.firstChild.textContent=collapsed?'›':'‹';
  btn.title=collapsed?'Expand sidebar':'Collapse sidebar';
  btn.setAttribute('aria-label',btn.title);
  const tip=btn.querySelector('.tool-tip');
  if(tip)tip.textContent=btn.title;
}
function toggleSidebar(){
  const nav=document.getElementById('canvas-tools');
  setSidebarCollapsed(!nav.classList.contains('sidebar-collapsed'));
}

try {
  const payload=decodeURIComponent(window.location.hash.slice(1));
  if(payload) data=JSON.parse(payload);
} catch(e){ console.error('Could not read flowchart data:',e); }
let ns=Array.isArray(data.nodes)?data.nodes:[], es=Array.isArray(data.edges)?data.edges:[], sel=null;
let linkMode=false, linkSource=null, dragState=null, rafId=0;
// Multi-selection: `sel` / `selEdge` stay as the "primary" box / arrow (used by formatting, extras...),
// selN holds every selected box id (as strings) and selE every selected arrow index.
let selN=new Set(), selE=new Set();
let multiSel=false; // true when the selection was made with Shift / the drag rectangle: shown in lilac
let curStyle='curve', curDash=false; // shape / dashed used for NEW arrows when no arrow is selected
let curColor=''; // shared default colour for new boxes and arrows
const isHex=c=>/^#[0-9a-f]{6}$/i.test(c||'');
function mixHex(h,base,t){ // t = share of `h` in the mix with `base`
  const p=i=>parseInt(h.substr(1+i*2,2),16),q=i=>parseInt(base.substr(1+i*2,2),16);
  return '#'+[0,1,2].map(i=>Math.round(p(i)*t+q(i)*(1-t)).toString(16).padStart(2,'0')).join('');
}
function paintNode(el,c){
  if(!isHex(c))return;
  el.style.setProperty('--nc',c);
  el.style.setProperty('--nfl',mixHex(c,'#ffffff',.16));
  el.style.setProperty('--nfd',mixHex(c,'#222a3c',.3));
  el.classList.add('has-color');
}
const edgeColor=e=>isHex(e.color)?e.color.toLowerCase():'';
function newEdge(from,to,fromSide,toSide){
  const e={from:from,to:to,fromSide:fromSide,toSide:toSide};
  if(curStyle!=='curve')e.style=curStyle;
  if(curDash)e.dash=true;
  if(isHex(curColor))e.color=curColor;
  return e;
}
function normSel(){
  const ids=new Set(ns.map(n=>String(n.id)));
  if(sel!==null&&!selN.has(String(sel)))selN.add(String(sel));
  selN=new Set([...selN].filter(id=>ids.has(id)));
  if(sel!==null&&!selN.has(String(sel)))sel=null;
  if(sel===null&&selN.size)sel=[...selN][selN.size-1];
  selE=new Set([...selE].filter(i=>es[i]));
  if(selEdge!==null&&!selE.has(selEdge))selEdge=null;
  if(selEdge===null&&selE.size)selEdge=[...selE][selE.size-1];
  document.documentElement.classList.toggle('multisel',multiSel&&(selN.size+selE.size)>0);
}
function selectOnlyNode(id){multiSel=false;selN=new Set([String(id)]);selE=new Set();sel=id;selEdge=null}
function selectOnlyEdges(idxs){multiSel=false;selE=new Set(idxs);selEdge=idxs.length?idxs[idxs.length-1]:null;selN=new Set();sel=null}
function clearSel(){multiSel=false;selN=new Set();selE=new Set();sel=null;selEdge=null}
function toggleNode(id){multiSel=true;const s=String(id);if(selN.has(s)){selN.delete(s);if(String(sel)===s)sel=selN.size?[...selN].pop():null}else{selN.add(s);sel=id}}
function toggleEdges(idxs){multiSel=true;const all=idxs.every(i=>selE.has(i));idxs.forEach(i=>all?selE.delete(i):selE.add(i));selEdge=all?(selE.size?[...selE].pop():null):idxs[idxs.length-1]}
function refreshSelection(){
  normSel();
  document.querySelectorAll('.node').forEach(el=>el.classList.toggle('selected',selN.has(el.id.slice(5))));
  renderLinesOnly();updateToolState();
}

// ---- Undo / redo: snapshots of boxes + arrows (the selection is not part of the history) ----
const HIST_MAX=200;let undoStack=[],redoStack=[];
function snapshot(){return JSON.stringify({nodes:ns,edges:es})}
function pushUndo(s){if(undoStack.length&&undoStack[undoStack.length-1]===s)return;undoStack.push(s);if(undoStack.length>HIST_MAX)undoStack.shift();redoStack=[]}

function centerOf(n){const z=nodeSize(n);return {x:n.x+z.w/2,y:n.y+z.h/2}}

// Inside a box, it always snaps; outside, only within MAGNET_RADIUS px of a point.
function findMagnet(pt,excludeId){
  let best=null;
  for(const o of ns){
    if(String(o.id)===String(excludeId))continue;
    const z=nodeSize(o),inside=pt.x>=o.x&&pt.x<=o.x+z.w&&pt.y>=o.y&&pt.y<=o.y+z.h;

function treeTpl(id,name,desc,root,rootColor,branches){
  const nodes=[],edges=[],P=230,n=branches.length;let nid=1,cz=0;
  const r={id:nid++,x:Math.round((n-1)*P/2),y:0,type:'box',text:root,cloze:0,color:rootColor};nodes.push(r);
  branches.forEach((b,i)=>{
    const col=b.c||rootColor,bn={id:nid++,x:i*P,y:150,type:'box',text:b.t,cloze:0,color:col};nodes.push(bn);
    edges.push({from:r.id,to:bn.id,fromSide:'bottom',toSide:'top',bif:'root'});
    let prev=bn;
    (b.kids||[]).forEach((k,j)=>{
      const kn={id:nid++,x:i*P,y:150+130*(j+1),type:'info',text:k[0],cloze:k[1]?++cz:0,color:col};
      nodes.push(kn);edges.push({from:prev.id,to:kn.id,fromSide:'bottom',toSide:'top'});prev=kn;
    });
  });
  return {id:id,name:name,desc:desc,builtin:true,nodes:nodes,edges:edges};
}

    ox=left;oy=bottom+90;

function zfClean(html){

  const OK={B:1,STRONG:1,I:1,EM:1,U:1,UL:1,OL:1,LI:1,SPAN:1,BR:1,DIV:1,P:1},DROP={SCRIPT:1,STYLE:1,IFRAME:1,OBJECT:1,EMBED:1,LINK:1,META:1,SVG:1,IMG:1};

    if(/^\d+(\.\d+)?px$/.test(st.fontSize)&&parseFloat(st.fontSize)>=6&&parseFloat(st.fontSize)<=120)o.push('font-size:'+st.fontSize);

    if(c.nodeType===3)return;

    if(DROP[c.tagName.toUpperCase()]){c.remove();return}

    const m=mq;if(!m.raf)m.raf=requestAnimationFrame(()=>{m.raf=0;if(mq===m)marqueeApply(m)}); // everything the rectangle touches is selected while dragging
  });
  // Selects the boxes the rectangle touches and the arrows that pass through it (Ctrl keeps the earlier selection).
  function marqueeApply(m){
    const q=m.rect;if(!q)return;
    const hit=(x,y)=>x>=q.x&&x<=q.x+q.w&&y>=q.y&&y<=q.y+q.h;
    const picked=ns.filter(n=>{const z=nodeSize(n);return n.x<q.x+q.w&&n.x+z.w>q.x&&n.y<q.y+q.h&&n.y+z.h>q.y});
    const ids=new Set(m.add?m.baseN:[]);picked.forEach(n=>ids.add(String(n.id)));
    const edges=new Set(m.add?m.baseE:[]);
    document.querySelectorAll('#svg path[data-i]').forEach(pth=>{
      const i=Number(pth.getAttribute('data-i'));if(edges.has(i))return;
      let L=0;try{L=pth.getTotalLength()}catch(_){return}
      const steps=Math.max(6,Math.ceil(L/8));
      for(let k=0;k<=steps;k++){const pt=pth.getPointAtLength(L*k/steps);if(hit(pt.x,pt.y)){edges.add(i);break}}
    });
    selN=ids;selE=edges;selEdge=edges.size?[...edges].pop():null;
    sel=picked.length?picked[picked.length-1].id:(ids.size?[...ids].pop():null);
    multiSel=true;refreshSelection();
    if(m.box)m.box.dataset.n=String(ids.size+edges.size);
  }
  const endMq=()=>{
    if(!mq)return;
    try{vp.releasePointerCapture(mq.id)}catch(_){}
    if(mq.moved&&mq.rect)marqueeApply(mq);
    if(mq.box)mq.box.remove();
    mq=null;
  };
  vp.addEventListener('pointerup',endMq);vp.addEventListener('pointercancel',endMq);
})();

let extraTarget=null,extraImgs=[];
// Image bridge: only available when the editor runs inside Anki (Python answers these prompts).
function hasBridge(){return typeof window.MEDFLOW_MEDIA_URL==='string'}
function bridge(cmd,payload){try{return prompt('__medflow__:'+cmd,payload||'')||''}catch(e){return ''}}
function addImgNames(r){try{JSON.parse(r||'[]').forEach(f=>{if(f&&!extraImgs.includes(f))extraImgs.push(f)})}catch(e){}renderExtraImgs()}
function addExtraImage(){addImgNames(bridge('pick'))}
function renderExtraImgs(){
  const box=document.getElementById('extraImgs');box.innerHTML='';
  extraImgs.forEach((f,i)=>{
    const w=document.createElement('div');w.className='xi';
    const im=document.createElement('img');im.src=window.MEDFLOW_MEDIA_URL+encodeURIComponent(f);im.title=f;
    const x=document.createElement('b');x.textContent='×';x.title='Remove image';x.onclick=()=>{extraImgs.splice(i,1);renderExtraImgs()};
    w.appendChild(im);w.appendChild(x);box.appendChild(w);
  });
}
// Ctrl+V while the extra window is open: Python checks the clipboard itself (image or copied image file).
// If it holds an image it is attached; otherwise the normal text paste goes ahead.
function tryPasteImage(){
  if(extraTarget===null||!hasBridge())return false;
  const before=extraImgs.length;addImgNames(bridge('pasteimg'));
  return extraImgs.length>before;
}
document.addEventListener('keydown',e=>{
  if(extraTarget===null)return;
  const k=e.key.toLowerCase();
  if(((e.ctrlKey||e.metaKey)&&k==='v')||(e.shiftKey&&e.key==='Insert')){if(tryPasteImage())e.preventDefault()}
},true);
document.addEventListener('paste',e=>{if(tryPasteImage())e.preventDefault()},true);
function editExtra(){
  if(sel===null){alert('Select a box first.');return}
  const n=ns.find(x=>String(x.id)===String(sel));if(!n)return;
  extraTarget=n.id;extraImgs=(n.images||[]).slice();
  document.getElementById('extraImgBox').style.display=hasBridge()?'block':'none';renderExtraImgs();
  document.getElementById('extraText').value=n.extra||'';
  document.getElementById('extraHint').textContent=Number(n.cloze)>0
    ?'Shown on the back of the card when this box (c'+n.cloze+') is the asked cloze.'
    :'This box has no cloze number yet. Its extra only appears once it has one.';
  document.getElementById('extraModal').style.display='flex';
  setTimeout(()=>document.getElementById('extraText').focus(),0);
}
function saveExtra(){
  const n=ns.find(x=>String(x.id)===String(extraTarget));
  if(n){checkpoint();const v=document.getElementById('extraText').value.trim();if(v)n.extra=v;else delete n.extra;if(extraImgs.length)n.images=extraImgs.slice();else delete n.images}
  closeExtra();render();
}
function closeExtra(){document.getElementById('extraModal').style.display='none';extraTarget=null}
function editText(){if(sel!==null){const el=nodeEl(sel);if(el)enterEditMode(el,sel)}}
document.addEventListener('paste',e=>{if(tryPasteImageIntoNode(e))e.preventDefault()},true);
document.addEventListener('keydown',e=>{
  const c=e.ctrlKey||e.metaKey, active=document.activeElement;
  const typing=active&&(active.isContentEditable||['INPUT','TEXTAREA','SELECT'].includes(active.tagName));
  const modalOpen=extraTarget!==null||hintTarget!==null||['labelModal','saveModal','importModal'].some(id=>document.getElementById(id).style.display==='flex');
  if(!typing&&!modalOpen&&!e.altKey&&sel!==null&&selN.size===1&&!linkMode){
    if(e.key==='Tab'&&!e.ctrlKey&&!e.metaKey&&!e.shiftKey){e.preventDefault();addRelatedNode('child');return}
    if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)&&!e.shiftKey){e.preventDefault();addRelatedNode('parent');return}
    if(e.key==='Enter'&&e.shiftKey&&!e.ctrlKey&&!e.metaKey){e.preventDefault();addRelatedNode('sibling-before');return}
    if(e.key==='Enter'&&!e.shiftKey&&!e.ctrlKey&&!e.metaKey){e.preventDefault();addRelatedNode('sibling-after');return}
  }
  if(e.key==='Escape'&&closeColorPops()){e.preventDefault();return}
  if(c&&e.key.toLowerCase()==='v'&&!typing&&!modalOpen&&!e.altKey){if(tryPasteImageIntoNode(e))return}
  if(c&&!typing&&!modalOpen&&!e.altKey){
    const k=e.key.toLowerCase();
    if(k==='z'){e.preventDefault();e.shiftKey?redo():undo();return}
    if(k==='y'&&!e.shiftKey){e.preventDefault();redo();return}
    if(k==='g'&&!e.shiftKey){e.preventDefault();toggleBifurcation();return}
  }
  if(e.key==='Escape'&&!typing&&!modalOpen&&!(linkMode&&linkSource!==null)&&(selN.size||selE.size)){e.preventDefault();clearSel();refreshSelection();return}
  if(c&&!typing&&!e.shiftKey&&!e.altKey){const k=e.key.toLowerCase();if(k==='a'){e.preventDefault();add('box');return}if(k==='b'){e.preventDefault();add('decision');return}if(k==='c'){e.preventDefault();add('info');return}}
  if(c&&e.shiftKey&&e.key.toLowerCase()==='e'){e.preventDefault();editText()}
  if(c&&e.shiftKey&&e.key.toLowerCase()==='x'){e.preventDefault();editExtra()}
  if(c&&e.shiftKey&&e.key.toLowerCase()==='h'){e.preventDefault();editHint()}
  if(c&&e.shiftKey&&e.key.toLowerCase()==='f'){e.preventDefault();toggleFocus()}
  if(c&&!e.altKey&&!e.shiftKey&&extraTarget===null){
    if(e.key==='='||e.key==='+'){e.preventDefault();zoomBy(1.2)}
    else if(e.key==='-'){e.preventDefault();zoomBy(1/1.2)}
    else if(e.key==='0'){e.preventDefault();setZoom(1)}
    else if(e.key==='9'){e.preventDefault();fitView()}
  }
  if(c&&e.key.toLowerCase()==='l'){e.preventDefault();toggleLink()}
  if(e.key==='Escape'&&!typing&&linkMode&&linkSource!==null){e.preventDefault();linkSource=null;render();return}
  if((e.key==='Enter'||e.key==='F2')&&!typing&&!modalOpen&&selE.size>0){e.preventDefault();labelSelected();return}
  if(e.key==='Delete'&&!typing){if(c&&e.shiftKey){e.preventDefault();clearAll()}else{e.preventDefault();del()}}
  if(c&&e.shiftKey&&!e.altKey&&e.key.toLowerCase()==='c'){e.preventDefault();applyCloze(1)}
  else if(c&&e.shiftKey&&e.altKey&&e.key.toLowerCase()==='c'){e.preventDefault();applyCloze(0)}
});


// ---- Image caption, box hint and focus flow ----
let hintTarget=null;
function decorateNode(d,n){
  if(n.focus){
    d.classList.add('is-focus');
    const f=document.createElement('div');f.className='node-focus-badge';f.textContent='focus';
    f.title='Focus branch: in review it is built arrow by arrow as the clozes are answered';d.appendChild(f);
  }
  const hasHint=!!(n.hint&&String(n.hint).trim());
  const hb=document.createElement('button');hb.type='button';hb.className='node-hint'+(hasHint?' has-hint':'');
  hb.textContent='+';hb.title=hasHint?n.hint:'Add a hint';hb.setAttribute('aria-label','Box hint');
  hb.addEventListener('click',ev=>{ev.stopPropagation();if(!selN.has(String(n.id))){selectOnlyNode(n.id);refreshSelection()}editHint(n.id)});
  d.appendChild(hb);
  if(hasHint){
    const lb=document.createElement('div');lb.className='node-hint-label';lb.textContent=n.hint;lb.title='Click to edit the hint';
    lb.addEventListener('click',ev=>{ev.stopPropagation();if(!selN.has(String(n.id))){selectOnlyNode(n.id);refreshSelection()}editHint(n.id)});
    d.appendChild(lb);
  }
  if(n.type==='image'&&n.src){
    const c=document.createElement('div');c.className='node-caption';c.contentEditable='true';c.spellcheck=false;c.dataset.ph='Caption...';
    c.textContent=n.caption||'';c.style.height=(Number(n.ch)||CAP_H)+'px';
    c.addEventListener('focus',()=>{if(selN.size!==1||!selN.has(String(n.id))){selectOnlyNode(n.id);refreshSelection()}});
    c.addEventListener('blur',()=>{
      const v=c.textContent.replace(/\s+/g,' ').trim();
      if(v!==(n.caption||'')){checkpoint();if(v)n.caption=v;else delete n.caption}
      if(c.textContent!==v)c.textContent=v;
      fitCaption(d,c,n);
    });
    c.addEventListener('input',()=>fitCaption(d,c,n));
    c.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key==='Escape'){e.preventDefault();c.blur()}e.stopPropagation()});
    c.addEventListener('paste',e=>{e.preventDefault();const t=(e.clipboardData||window.clipboardData).getData('text/plain').replace(/\s+/g,' ');document.execCommand('insertText',false,t)});
    d.appendChild(c);
    if(n.caption)requestAnimationFrame(()=>fitCaption(d,c,n));
  }
}
function fitCaption(d,c,n){
  if(!d.isConnected)return;
  const cur=Number(n.ch)||CAP_H;
  c.style.height='auto';
  const need=Math.max(CAP_H,Math.ceil(c.offsetHeight));
  c.style.height=need+'px';
  if(need!==cur){n.h=(Number(n.h)||150)+need-cur;n.ch=need;d.style.height=n.h+'px';scheduleLines()}
}
function hintOutside(e){const pop=document.getElementById('hintPop');if(pop&&!pop.contains(e.target))saveHint()}
// id: the box whose + was clicked (several selected boxes: the hint goes to all of them); without id: the primary selected box
function editHint(id){
  const key=id!==undefined?id:sel;
  if(key===null){alert('Select a box first.');return}
  const n=ns.find(x=>String(x.id)===String(key));if(!n)return;
  const el=nodeEl(n.id);if(!el)return;
  closeHint();hintTarget=n.id;
  const pop=document.createElement('div');pop.id='hintPop';
  const ta=document.createElement('textarea');ta.placeholder=(selN.has(String(n.id))&&selN.size>1)?'Hint for all '+selN.size+' selected boxes...':'Hint...';ta.value=n.hint||'';
  const ok=document.createElement('button');ok.type='button';ok.className='hp-ok';ok.textContent='OK';ok.onclick=saveHint;
  const no=document.createElement('button');no.type='button';no.className='hp-no';no.textContent='Cancel';no.onclick=closeHint;
  ta.addEventListener('keydown',e=>{
    if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();saveHint()}
    else if(e.key==='Escape'){e.preventDefault();closeHint()}
    e.stopPropagation();
  });
  pop.appendChild(ta);pop.appendChild(ok);pop.appendChild(no);document.body.appendChild(pop);
  const r=el.getBoundingClientRect(),W=pop.offsetWidth||230,H=pop.offsetHeight||110;
  let left=r.right+10;if(left+W>window.innerWidth-8)left=Math.max(8,r.left-W-10);
  pop.style.left=left+'px';pop.style.top=Math.max(8,Math.min(r.top,window.innerHeight-H-8))+'px';
  ta.focus();ta.setSelectionRange(ta.value.length,ta.value.length);
  setTimeout(()=>document.addEventListener('pointerdown',hintOutside,true),0);
}
function saveHint(){
  const pop=document.getElementById('hintPop');
  const n=ns.find(x=>String(x.id)===String(hintTarget));
  if(n&&pop){
    const v=pop.querySelector('textarea').value.trim();
    if(v!==(n.hint||'')){
      checkpoint();
      const group=selN.has(String(n.id))?ns.filter(x=>selN.has(String(x.id))):[n];
      group.forEach(x=>{if(v)x.hint=v;else delete x.hint});
    }
  }
  closeHint();render();
}
function closeHint(){
  const pop=document.getElementById('hintPop');if(pop)pop.remove();
  document.removeEventListener('pointerdown',hintOutside,true);hintTarget=null;
}
// Focus branch: the selected boxes become a focus group (several boxes: exactly those; a single box: it plus everything that
// hangs from it). Selecting boxes that are already in a group removes the whole group.
function toggleFocus(){
  const targets=ns.filter(n=>selN.has(String(n.id)));
  if(!targets.length){alert('Select the boxes of the branch first (Shift+drag), or just its first box.');return}
  checkpoint();
  if(targets.every(n=>n.focus)){
    const gids=new Set(targets.map(n=>String(n.focus)));
    ns.forEach(n=>{if(n.focus&&gids.has(String(n.focus)))delete n.focus});
  }else{
    let group=targets;
    if(targets.length===1){
      const seen=new Set([String(targets[0].id)]),todo=[String(targets[0].id)];
      while(todo.length){const k=todo.pop();es.forEach(e=>{if(String(e.from)===k&&!seen.has(String(e.to))){seen.add(String(e.to));todo.push(String(e.to))}})}
      group=ns.filter(n=>seen.has(String(n.id)));
    }
    const gid=Date.now();
    group.forEach(n=>{n.focus=gid});
  }
  render();
}

// The browser's native drag-and-drop (of a text selection or an image) must never start on the canvas: it showed a ghost copy of the
// text and the "not allowed" sign while panning. Dragging inside text fields still works.
document.addEventListener('dragstart',e=>{const t=e.target&&e.target.closest?e.target:null;if(t&&t.closest('textarea,input,.node.editing,.node-caption'))return;e.preventDefault()},true);
